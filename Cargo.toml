[package]
name = "napi_router"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "napi_router"

[package.metadata.napi]
targets = [
  "x86_64-pc-windows-msvc",
  "i686-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu"
]

[dependencies]
napi = { version = "3.8.2", features = ["napi9", "async", "tokio_rt"] }
napi-derive = "3.5.1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"
tokio-tungstenite = "0.24"
futures-util = "0.3"
bytes = "1"
sha1 = "0.10"
base64 = "0.22"
url = "2"

[build-dependencies]
napi-build = "2.3.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
